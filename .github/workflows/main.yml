name: 'CI/CD'

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint_js:
    name: Lint JavaScript Files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install JSHint
        run: npm install jshint --global

      - name: Run Linter
        run: |
          find ./secondChance-backend -name app.js -exec jshint {} \;
          find ./secondChance-backend/models -name '*.js' -exec jshint {} \;
          find ./secondChance-backend/routes -name '*.js' -exec jshint {} \;
          find ./sentiment -name index.js -exec jshint {} \;
          echo "Linted all the js files successfully"

  client_build:
    name: Build client
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Run build
        run: |
          cd secondChance-frontend
          npm install
          npm run build
          echo "Client-side build successful"

  docker_build:
    name: Build Docker images
    runs-on: ubuntu-latest
    needs: [lint_js, client_build]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build back-end image
        run: docker build -t secondchance-backend ./secondChance-backend

      - name: Build sentiment image
        run: docker build -t secondchance-sentiment ./sentiment

      - name: Build front-end image
        run: docker build -t secondchance-frontend ./secondChance-frontend
