server {
    listen 8080;
    root /usr/share/nginx/html;

    # Landing page (title, slogan and "Get Started" button)
    location = / {
        try_files /home.html =404;
    }

    # Send every client-side route (/app, /app/login, ...) to the React app
    location / {
        try_files $uri $uri/ /index.html;
    }
}
