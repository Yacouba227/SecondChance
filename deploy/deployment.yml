apiVersion: apps/v1
kind: Deployment
metadata:
  name: secondchance-backend
  labels:
    app: secondchance-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: secondchance-backend
  template:
    metadata:
      labels:
        app: secondchance-backend
    spec:
      containers:
        - name: secondchance-backend
          # Replace with your image, e.g. us.icr.io/<namespace>/secondchance-backend:latest
          image: us.icr.io/<your-namespace>/secondchance-backend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3060
          env:
            - name: MONGO_DB
              value: secondChance
            - name: MONGO_COLLECTION
              value: secondChanceItems
            - name: MONGO_URL
              valueFrom:
                secretKeyRef:
                  name: secondchance-secrets
                  key: mongo-url
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: secondchance-secrets
                  key: jwt-secret
      imagePullSecrets:
        - name: icr
---
apiVersion: v1
kind: Service
metadata:
  name: secondchance-backend-service
spec:
  type: NodePort
  selector:
    app: secondchance-backend
  ports:
    - protocol: TCP
      port: 3060
      targetPort: 3060
